name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Assets
        run: |
          cd web-frontend
          npm install
          npm run build
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Gradle execute permission
        run: chmod +x web-frontend/android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd web-frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LabelLens-Inspector-APK
          path: web-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
